name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (linux, python)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: [ '3.14' ]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm pkg-config
      - name: Cache pip
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml','**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run linters
        run: python -m ruff check . && python -m black --check .
      - name: Run unit tests with coverage
        run: python -m pytest -m 'not integration' --cov=usurp --cov-report=term-missing --cov-fail-under=100 -q
      - name: Run integration tests
        run: python -m pytest -m integration -q
      - name: Run type checks
        run: python -m mypy usurp

  docker-build:
    name: Build multi-arch Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build multiarch image
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: usurp:ci-${{ github.sha }}
      - name: Save image metadata
        run: echo "Built docker image for ${GITHUB_SHA}" > image-builtnote.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: docker-image-note
          path: image-builtnote.txt

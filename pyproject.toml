[build-system]
requires = ["setuptools>=65.5", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usurp"
version = "0.1.0"
description = "Autonomous Google SERP Extraction Engine"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [{name = "Freya Jeffers"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.10,<3",
  "curl-cffi>=0.7,<1",
  "selectolax>=0.3",
  "playwright>=1.50",
  "camoufox>=0.5,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "prometheus-client>=0.17.0,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6",
  "ruff>=0.8",
  "black>=24",
  "mypy>=1.13",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["usurp*"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
asyncio_mode = "auto"
markers = ["integration: tests that exercise multiple application layers"]